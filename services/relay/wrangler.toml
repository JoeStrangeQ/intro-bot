# Public repo: no secrets here. RPC_URL is set per environment; see README.md.
name = "intro-bot-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"
assets = { directory = "public" }

[[durable_objects.bindings]]
name = "TX"
class_name = "TxStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TxStore"]

# 60 calls per minute per IP, per kind (create, read, sign).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Local dev only (`wrangler dev`): public devnet.
[vars]
RPC_URL = "https://api.devnet.solana.com"

[env.production]
# Served on workers.dev (botbotcap.com DNS is not on Cloudflare).
workers_dev = true
# RPC_URL comes from `wrangler secret put RPC_URL --env production`.
vars = {}
durable_objects.bindings = [{ name = "TX", class_name = "TxStore" }]
ratelimits = [{ name = "LIMITER", namespace_id = "1001", simple = { limit = 60, period = 60 } }]
